<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1343px" preserveAspectRatio="none" style="width:1282px;height:1343px;background:#FFFFFF;" version="1.1" viewBox="0 0 1282 1343" width="1282px" zoomAndPan="magnify"><title>UpDown QnD &#8212; Room State Machine
