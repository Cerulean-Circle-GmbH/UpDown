<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1141px" preserveAspectRatio="none" style="width:1016px;height:1141px;background:#FFFFFF;" version="1.1" viewBox="0 0 1016 1141" width="1016px" zoomAndPan="magnify"><title>UpDown QnD &#8212; Room State Machine
States: waiting &#8594; countdown &#8594; revealing &#8594; exchange &#8594; finished
&lt;color:red&gt;BUG: 'finished' is terminal &#8212; no path back to 'waiting'&lt;/color&gt;</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="418.3652" x="294.3647" y="36.2695">UpDown QnD &#8212; Room State Machine</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="741.1895" x="132.9526" y="62.1797">States: waiting &#8594; countdown &#8594; revealing &#8594; exchange &#8594; finished</text><text fill="#FF0000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="607.1377" x="199.9785" y="88.0898">BUG: 'finished' is terminal &#8212; no path back to 'waiting'</text></g><g class="entity" data-qualified-name="W" id="ent0002"><rect fill="#A5D6A7" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="190.666" x="51.52" y="568.7205"/><line style="stroke:#000000;stroke-width:1;" x1="51.52" x2="242.186" y1="589.3201" y2="589.3201"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="131.0173" y="582.4216">waiting</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="94.8252" x="56.52" y="603.0212">Players can join/leave</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.251" x="56.52" y="613.6209">Host can add bots</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.7764" x="56.52" y="624.2205">Host can start game</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="170.666" x="56.52" y="634.8201">Lobby countdown (30s) may auto-start</text></g><g class="entity" data-qualified-name="CD" id="ent0003"><rect fill="#FFE082" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="99.31" y="750.9205"/><line style="stroke:#000000;stroke-width:1;" x1="99.31" x2="280.3959" y1="771.5201" y2="771.5201"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="48.3882" x="165.6589" y="764.6216">countdown</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.3882" x="104.31" y="785.2212">10-second round timer</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="104.31" y="795.8209">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="104.31" y="806.4205">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="119.3203" x="104.31" y="817.0201">Timer ticks broadcast to all</text></g><g class="entity" data-qualified-name="RV" id="ent0004"><rect fill="#FFF3E0" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="134.8423" x="274.43" y="916.9105"/><line style="stroke:#000000;stroke-width:1;" x1="274.43" x2="409.2723" y1="937.5101" y2="937.5101"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="39.7397" x="321.9813" y="930.6116">revealing</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.6538" x="279.43" y="951.2113">Round resolved</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="75.1113" x="279.43" y="961.8109">Scores calculated</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="100.5117" x="279.43" y="972.4105">Eliminations processed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="114.8423" x="279.43" y="983.0101">ROUND_RESULT broadcast</text></g><g class="entity" data-qualified-name="EX" id="ent0005"><rect fill="#E3F2FD" height="62.3984" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="166.7642" x="61.47" y="1072.9105"/><line style="stroke:#000000;stroke-width:1;" x1="61.47" x2="228.2342" y1="1093.5101" y2="1093.5101"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.9106" x="123.8968" y="1086.6116">exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="143.4814" x="66.47" y="1107.2112">3-second pause between rounds</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="146.7642" x="66.47" y="1117.8109">Players can JOIN during exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="137.8257" x="66.47" y="1128.4105">Next round auto-starts after 3s</text></g><g class="entity" data-qualified-name="FIN" id="ent0006"><rect fill="#EF9A9A" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="161.5786" x="349.06" y="253.1305"/><line style="stroke:#000000;stroke-width:1;" x1="349.06" x2="510.6386" y1="273.7301" y2="273.7301"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.9497" x="412.3745" y="266.8316">finished</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="99.1802" x="354.06" y="287.4313">GAME_OVER broadcast</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="141.5786" x="354.06" y="298.0309">Leaderboard + diamonds shown</text><text fill="#FF0000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="84.7134" x="354.06" y="308.6305">STATE IS TERMINAL</text><text fill="#FF0000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.4258" x="354.06" y="319.2301">No reset back to 'waiting'</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0002"><ellipse cx="883.85" cy="289.6305" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="waiting" id="ent0003"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="51.6714" x="858.02" y="580.2205"/><line style="stroke:#000000;stroke-width:1;" x1="858.02" x2="909.6914" y1="600.8201" y2="600.8201"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="868.02" y="593.9216">waiting</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="64" id="ent0003"><path d="M545.83,109.7305 L545.83,285.6305 L510.99,289.6305 L545.83,293.6305 L545.83,469.5176 A0,0 0 0 0 545.83,469.5176 L767.8842,469.5176 A0,0 0 0 0 767.8842,469.5176 L767.8842,119.7305 L757.8842,109.7305 L545.83,109.7305 A0,0 0 0 0 545.83,109.7305" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M757.8842,109.7305 L757.8842,119.7305 L767.8842,119.7305 L757.8842,109.7305" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="167.2866" x="551.83" y="123.4316">BUG ANALYSIS: Play Again is broken</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="551.83" y="134.0313">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="105.7148" x="551.83" y="144.6309">Current flow (WRONG):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.1768" x="551.83" y="155.2305">1. endGame() sets state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="130.9482" x="551.83" y="165.8301">2. Client receives GAME_OVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="125.7363" x="551.83" y="176.4297">3. 'Play Again' button clicked</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.3403" x="551.83" y="187.0293">4. Client calls leaveRoom() &#8592; WRONG</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="196.6377" x="551.83" y="197.6289">5. Client calls joinRoom(sameId) after 500ms</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.5542" x="551.83" y="208.2285">6. But for user-created rooms:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="109.1074" x="560.373" y="218.8281">- 60s cleanup timer runs</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.8408" x="560.373" y="229.4277">- Room may be deleted</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="132.8687" x="560.373" y="240.0273">- Even if alive, state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="173.6587" x="560.373" y="250.627">- addPlayer() rejects: state !== 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="551.83" y="261.2266">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="81.9053" x="551.83" y="271.8262">For preset rooms:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="176.8799" x="551.83" y="282.4258">- autoRecreate deletes &amp; recreates room</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="201.0542" x="551.83" y="293.0254">- Same room ID but NEW GameRoom instance</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="177.2974" x="551.83" y="303.625">- Players must re-join (lose chat history)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="171.1362" x="551.83" y="314.2246">- Race condition on 500ms setTimeout</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="551.83" y="324.8242">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="121.6626" x="551.83" y="335.4238">Correct flow (SHOULD BE):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.1768" x="551.83" y="346.0234">1. endGame() sets state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="130.9482" x="551.83" y="356.623">2. Client receives GAME_OVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="93.7925" x="551.83" y="367.2227">3. 'Play Again' clicked</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.2085" x="551.83" y="377.8223">4. Client sends PLAY_AGAIN message</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="140.168" x="551.83" y="388.4219">5. Server: room.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.8486" x="560.373" y="399.0215">- state &#8594; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.2085" x="560.373" y="409.6211">- reset scores, alive, hands</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.9048" x="560.373" y="420.2207">- keep players connected</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="83.2896" x="560.373" y="430.8203">- keep chat history</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.5239" x="551.83" y="441.4199">6. Server broadcasts ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="187.7344" x="551.83" y="452.0195">7. All clients show lobby with same players</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.9678" x="551.83" y="462.6191">8. Host starts new game when ready</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="100" id="ent0006"><path d="M529.81,552.5205 L529.81,657.917 L705.8974,657.917 L705.8974,562.5205 L695.8974,552.5205 L529.81,552.5205" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M695.8974,552.5205 L695.8974,562.5205 L705.8974,562.5205 L695.8974,552.5205" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="111.0278" x="535.81" y="566.2216">Join guards (addPlayer):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="154.0503" x="535.81" y="576.8213">- size &gt;= maxPlayers &#8594; reject [R7]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.4521" x="535.81" y="587.4209">- state !== 'waiting' AND</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.3921" x="541.5053" y="598.0205">state !== 'exchange' &#8594; reject [R9]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.1963" x="535.81" y="608.6201">- state === 'exchange' &#8594; OK [R8]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="535.81" y="619.2197">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.0908" x="535.81" y="629.8193">These guards BLOCK replay:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.1738" x="535.81" y="640.4189">state='finished' &#8800; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="112.5308" x="535.81" y="651.0185">so rejoin after leave FAILS</text></g><!--link *start* to waiting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="8" id="lnk4"><path d="M883.85,300.0105 C883.85,342.3005 883.85,509.9005 883.85,574.1505" fill="none" id="*start*-to-waiting" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="883.85,580.1505,887.85,571.1505,883.85,575.1505,879.85,571.1505,883.85,580.1505" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="60.3193" x="916.3126" y="509.2216">Room created</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.2446" x="884.85" y="519.8213">(RoomManager.createRoom)</text></g><!--link W to CD--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="44" id="lnk5"><path d="M155.35,641.8205 C162.86,673.3105 172.3775,713.1843 179.9075,744.7443" fill="none" id="W-to-CD" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="181.3,750.5805,183.1021,740.8979,180.1396,745.717,175.3205,742.7545,181.3,750.5805" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="72.6328" x="178.5349" y="697.6216">host.startGame()