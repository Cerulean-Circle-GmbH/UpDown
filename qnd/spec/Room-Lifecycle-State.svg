<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1514px" preserveAspectRatio="none" style="width:1315px;height:1514px;background:#FFFFFF;" version="1.1" viewBox="0 0 1315 1514" width="1315px" zoomAndPan="magnify"><title>UpDown QnD &#8212; Room State Machine
States: waiting &#8594; countdown/hostControl &#8594; revealing &#8594; exchange &#8594; finished
&lt;color:red&gt;BUG: 'finished' is terminal &#8212; no path back to 'waiting'&lt;/color&gt;
&lt;color:blue&gt;NEW: Host can toggle countdown OFF &#8594; manual 'Force Next Round'&lt;/color&gt;</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="418.3652" x="443.9597" y="36.2695">UpDown QnD &#8212; Room State Machine</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="887.7773" x="209.2536" y="62.1797">States: waiting &#8594; countdown/hostControl &#8594; revealing &#8594; exchange &#8594; finished</text><text fill="#FF0000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="607.1377" x="349.5735" y="88.0898">BUG: 'finished' is terminal &#8212; no path back to 'waiting'</text><text fill="#0000FF" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="762.4805" x="271.9021" y="114">NEW: Host can toggle countdown OFF &#8594; manual 'Force Next Round'</text></g><g class="entity" data-qualified-name="W" id="ent0002"><rect fill="#A5D6A7" height="104.7969" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="190.666" x="221.71" y="578.7306"/><line style="stroke:#000000;stroke-width:1;" x1="221.71" x2="412.376" y1="599.3302" y2="599.3302"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="301.2073" y="592.4318">waiting</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="94.8252" x="226.71" y="613.0314">Players can join/leave</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.251" x="226.71" y="623.631">Host can add bots</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.7764" x="226.71" y="634.2306">Host can start game</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="170.666" x="226.71" y="644.8302">Lobby countdown (30s) may auto-start</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.5083" x="226.71" y="655.4298">host.toggleCountdown()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.998" x="226.71" y="666.0295">sets countdownEnabled on/off</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="91.6787" x="226.71" y="676.6291">before starting game</text></g><g class="entity" data-qualified-name="CD" id="ent0003"><rect fill="#FFE082" height="83.5977" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="426.5" y="1424.4106"/><line style="stroke:#000000;stroke-width:1;" x1="426.5" x2="607.5859" y1="1445.0102" y2="1445.0102"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="48.3882" x="492.8489" y="1438.1118">countdown</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.3882" x="431.5" y="1458.7114">10-second round timer</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="431.5" y="1469.311">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="431.5" y="1479.9106">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="119.3203" x="431.5" y="1490.5102">Timer ticks broadcast to all</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="113.2646" x="431.5" y="1501.1098">countdownEnabled = true</text></g><g class="entity" data-qualified-name="HC" id="ent0004"><rect fill="#E1BEE7" height="94.1973" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="386.5" y="851.3206"/><line style="stroke:#000000;stroke-width:1;" x1="386.5" x2="567.5859" y1="871.9202" y2="871.9202"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="51.5874" x="451.2493" y="865.0218">hostControl</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.2993" x="391.5" y="885.6214">No timer &#8212; host controls pace</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="391.5" y="896.221">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="391.5" y="906.8206">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="159.0205" x="391.5" y="917.4202">Host sees 'Force Next Round' button</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.8994" x="391.5" y="928.0198">Auto-resolve when allPlayed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.0991" x="391.5" y="938.6195">countdownEnabled = false</text></g><g class="entity" data-qualified-name="RV" id="ent0005"><rect fill="#FFF3E0" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="134.8423" x="656.62" y="1113.0206"/><line style="stroke:#000000;stroke-width:1;" x1="656.62" x2="791.4623" y1="1133.6202" y2="1133.6202"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="39.7397" x="704.1713" y="1126.7218">revealing</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.6538" x="661.62" y="1147.3214">Round resolved</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="75.1113" x="661.62" y="1157.921">Scores calculated</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="100.5117" x="661.62" y="1168.5206">Eliminations processed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="114.8423" x="661.62" y="1179.1202">ROUND_RESULT broadcast</text></g><g class="entity" data-qualified-name="EX" id="ent0006"><rect fill="#E3F2FD" height="62.3984" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="166.7642" x="603.66" y="1269.0106"/><line style="stroke:#000000;stroke-width:1;" x1="603.66" x2="770.4242" y1="1289.6102" y2="1289.6102"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.9106" x="666.0868" y="1282.7118">exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="143.4814" x="608.66" y="1303.3114">3-second pause between rounds</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="146.7642" x="608.66" y="1313.911">Players can JOIN during exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="137.8257" x="608.66" y="1324.5106">Next round auto-starts after 3s</text></g><g class="entity" data-qualified-name="FIN" id="ent0007"><rect fill="#EF9A9A" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="161.5786" x="719.25" y="279.0406"/><line style="stroke:#000000;stroke-width:1;" x1="719.25" x2="880.8286" y1="299.6402" y2="299.6402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.9497" x="782.5645" y="292.7418">finished</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="99.1802" x="724.25" y="313.3414">GAME_OVER broadcast</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="141.5786" x="724.25" y="323.941">Leaderboard + diamonds shown</text><text fill="#FF0000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="84.7134" x="724.25" y="334.5406">STATE IS TERMINAL</text><text fill="#FF0000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.4258" x="724.25" y="345.1402">No reset back to 'waiting'</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0002"><ellipse cx="1183.04" cy="315.5306" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="waiting" id="ent0003"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="51.6714" x="1157.21" y="606.1306"/><line style="stroke:#000000;stroke-width:1;" x1="1157.21" x2="1208.8814" y1="626.7302" y2="626.7302"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="1167.21" y="619.8318">waiting</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="83" id="ent0003"><path d="M916.02,135.6406 L916.02,311.5306 L881.18,315.5306 L916.02,319.5306 L916.02,495.4277 A0,0 0 0 0 916.02,495.4277 L1138.0742,495.4277 A0,0 0 0 0 1138.0742,495.4277 L1138.0742,145.6406 L1128.0742,135.6406 L916.02,135.6406 A0,0 0 0 0 916.02,135.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1128.0742,135.6406 L1128.0742,145.6406 L1138.0742,145.6406 L1128.0742,135.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="167.2866" x="922.02" y="149.3418">BUG ANALYSIS: Play Again is broken</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="922.02" y="159.9414">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="105.7148" x="922.02" y="170.541">Current flow (WRONG):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.1768" x="922.02" y="181.1406">1. endGame() sets state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="130.9482" x="922.02" y="191.7402">2. Client receives GAME_OVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="125.7363" x="922.02" y="202.3398">3. 'Play Again' button clicked</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.3403" x="922.02" y="212.9395">4. Client calls leaveRoom() &#8592; WRONG</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="196.6377" x="922.02" y="223.5391">5. Client calls joinRoom(sameId) after 500ms</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.5542" x="922.02" y="234.1387">6. But for user-created rooms:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="109.1074" x="930.563" y="244.7383">- 60s cleanup timer runs</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.8408" x="930.563" y="255.3379">- Room may be deleted</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="132.8687" x="930.563" y="265.9375">- Even if alive, state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="173.6587" x="930.563" y="276.5371">- addPlayer() rejects: state !== 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="922.02" y="287.1367">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="81.9053" x="922.02" y="297.7363">For preset rooms:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="176.8799" x="922.02" y="308.3359">- autoRecreate deletes &amp; recreates room</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="201.0542" x="922.02" y="318.9355">- Same room ID but NEW GameRoom instance</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="177.2974" x="922.02" y="329.5352">- Players must re-join (lose chat history)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="171.1362" x="922.02" y="340.1348">- Race condition on 500ms setTimeout</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="922.02" y="350.7344">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="121.6626" x="922.02" y="361.334">Correct flow (SHOULD BE):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.1768" x="922.02" y="371.9336">1. endGame() sets state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="130.9482" x="922.02" y="382.5332">2. Client receives GAME_OVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="93.7925" x="922.02" y="393.1328">3. 'Play Again' clicked</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.2085" x="922.02" y="403.7324">4. Client sends PLAY_AGAIN message</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="140.168" x="922.02" y="414.332">5. Server: room.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.8486" x="930.563" y="424.9316">- state &#8594; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.2085" x="930.563" y="435.5313">- reset scores, alive, hands</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.9048" x="930.563" y="446.1309">- keep players connected</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="83.2896" x="930.563" y="456.7305">- keep chat history</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.5239" x="922.02" y="467.3301">6. Server broadcasts ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="187.7344" x="922.02" y="477.9297">7. All clients show lobby with same players</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.9678" x="922.02" y="488.5293">8. Host starts new game when ready</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="119" id="ent0006"><path d="M602.34,776.8206 L602.34,894.4206 L568.07,898.4206 L602.34,902.4206 L602.34,1020.012 A0,0 0 0 0 602.34,1020.012 L797.7546,1020.012 A0,0 0 0 0 797.7546,1020.012 L797.7546,786.8206 L787.7546,776.8206 L602.34,776.8206 A0,0 0 0 0 602.34,776.8206" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M787.7546,776.8206 L787.7546,786.8206 L797.7546,786.8206 L787.7546,776.8206" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="168.8203" x="608.34" y="790.5218">Host Control Mode (countdown OFF)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="608.34" y="801.1214">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="34.2554" x="608.34" y="811.721">Toggle:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="115.8398" x="645.443" y="811.721">Host clicks toggle in lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="172.3008" x="608.34" y="822.3206">before starting game. Sets room option</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.9468" x="608.34" y="832.9202">countdownEnabled = false.</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="608.34" y="843.5198">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="64.7271" x="608.34" y="854.1195">During round:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.2534" x="608.34" y="864.7191">- No 10s timer runs</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="145.1074" x="608.34" y="875.3187">- Players guess at their own pace</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="169.6772" x="608.34" y="885.9183">- Host sees "Force Next Round" button</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="127.9424" x="608.34" y="896.5179">- allPlayed still auto-resolves</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="131.269" x="608.34" y="907.1175">- Host can force-resolve early</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="608.34" y="917.7171">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="42.6226" x="608.34" y="928.3167">Use case:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.9946" x="653.8102" y="928.3167">Teaching, demo, casual</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.3174" x="608.34" y="938.9163">play where time pressure unwanted.</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="608.34" y="949.5159">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="75.1816" x="608.34" y="960.1155">Implementation:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="168.5962" x="608.34" y="970.7152">- GameRoom: countdownEnabled field</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.665" x="608.34" y="981.3148">- startCountdown(): skip if !enabled</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="174.4146" x="608.34" y="991.9144">- New MSG: FORCE_RESOLVE (host only)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.4585" x="608.34" y="1002.514">- UI: toggle switch in lobby settings</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="162.0088" x="608.34" y="1013.1136">- UI: "Force Next Round" btn for host</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="144" id="ent0009"><path d="M11,578.4306 L11,683.8271 A0,0 0 0 0 11,683.8271 L187.0874,683.8271 A0,0 0 0 0 187.0874,683.8271 L187.0874,635.1306 L221.42,631.1306 L187.0874,627.1306 L187.0874,588.4306 L177.0874,578.4306 L11,578.4306 A0,0 0 0 0 11,578.4306" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M177.0874,578.4306 L177.0874,588.4306 L187.0874,588.4306 L177.0874,578.4306" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="111.0278" x="17" y="592.1318">Join guards (addPlayer):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="154.0503" x="17" y="602.7314">- size &gt;= maxPlayers &#8594; reject [R7]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.4521" x="17" y="613.331">- state !== 'waiting' AND</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.3921" x="22.6953" y="623.9306">state !== 'exchange' &#8594; reject [R9]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.1963" x="17" y="634.5302">- state === 'exchange' &#8594; OK [R8]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="17" y="645.1298">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.0908" x="17" y="655.7295">These guards BLOCK replay:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.1738" x="17" y="666.3291">state='finished' &#8800; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="112.5308" x="17" y="676.9287">so rejoin after leave FAILS</text></g><!--link *start* to waiting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="8" id="lnk4"><path d="M1183.04,325.9206 C1183.04,368.2106 1183.04,535.8006 1183.04,600.0606" fill="none" id="*start*-to-waiting" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1183.04,606.0606,1187.04,597.0606,1183.04,601.0606,1179.04,597.0606,1183.04,606.0606" style="stroke:#000000;stroke-width:1;"/><text f