&lt;color:green&gt;FIXED (Task 35): resetForReplay() returns room to 'waiting'&lt;/color&gt;
&lt;color:blue&gt;Task 37: Host can toggle countdown OFF &#8594; manual 'Force Next Round'&lt;/color&gt;</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="418.3652" x="427.4397" y="36.2695">UpDown QnD &#8212; Room State Machine</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="1008.3799" x="132.4324" y="62.1797">States: waiting &#8594; countdown/hostControl &#8594; revealing &#8594; exchange &#8594; finished &#8594; waiting</text><text fill="#008000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="667.4658" x="302.8894" y="88.0898">FIXED (Task 35): resetForReplay() returns room to 'waiting'</text><text fill="#0000FF" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="803.2256" x="235.0095" y="114">Task 37: Host can toggle countdown OFF &#8594; manual 'Force Next Round'</text></g><g class="entity" data-qualified-name="W" id="ent0002"><rect fill="#A5D6A7" height="104.7969" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="190.666" x="395.67" y="403.2406"/><line style="stroke:#000000;stroke-width:1;" x1="395.67" x2="586.336" y1="423.8402" y2="423.8402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="475.1673" y="416.9418">waiting</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="94.8252" x="400.67" y="437.5414">Players can join/leave</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.251" x="400.67" y="448.141">Host can add bots</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.7764" x="400.67" y="458.7406">Host can start game</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="170.666" x="400.67" y="469.3402">Lobby countdown (30s) may auto-start</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.5083" x="400.67" y="479.9398">host.toggleCountdown()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.998" x="400.67" y="490.5395">sets countdownEnabled on/off</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="91.6787" x="400.67" y="501.1391">before starting game</text></g><g class="entity" data-qualified-name="CD" id="ent0003"><rect fill="#FFE082" height="83.5977" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="414.46" y="1254.2206"/><line style="stroke:#000000;stroke-width:1;" x1="414.46" x2="595.5459" y1="1274.8202" y2="1274.8202"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="48.3882" x="480.8089" y="1267.9218">countdown</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.3882" x="419.46" y="1288.5214">10-second round timer</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="419.46" y="1299.121">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="419.46" y="1309.7206">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="119.3203" x="419.46" y="1320.3202">Timer ticks broadcast to all</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="113.2646" x="419.46" y="1330.9198">countdownEnabled = true</text></g><g class="entity" data-qualified-name="HC" id="ent0004"><rect fill="#E1BEE7" height="94.1973" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="406.46" y="681.1306"/><line style="stroke:#000000;stroke-width:1;" x1="406.46" x2="587.5459" y1="701.7302" y2="701.7302"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="51.5874" x="471.2093" y="694.8318">hostControl</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.2993" x="411.46" y="715.4314">No timer &#8212; host controls pace</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="411.46" y="726.031">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="411.46" y="736.6306">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="159.0205" x="411.46" y="747.2302">Host sees 'Force Next Round' button</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.8994" x="411.46" y="757.8298">Auto-resolve when allPlayed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.0991" x="411.46" y="768.4295">countdownEnabled = false</text></g><g class="entity" data-qualified-name="RV" id="ent0005"><rect fill="#FFF3E0" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="134.8423" x="645.58" y="942.8306"/><line style="stroke:#000000;stroke-width:1;" x1="645.58" x2="780.4223" y1="963.4302" y2="963.4302"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="39.7397" x="693.1313" y="956.5318">revealing</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.6538" x="650.58" y="977.1314">Round resolved</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="75.1113" x="650.58" y="987.731">Scores calculated</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="100.5117" x="650.58" y="998.3306">Eliminations processed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="114.8423" x="650.58" y="1008.9302">ROUND_RESULT broadcast</text></g><g class="entity" data-qualified-name="EX" id="ent0006"><rect fill="#E3F2FD" height="62.3984" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="166.7642" x="591.62" y="1098.8206"/><line style="stroke:#000000;stroke-width:1;" x1="591.62" x2="758.3842" y1="1119.4202" y2="1119.4202"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.9106" x="654.0468" y="1112.5218">exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="143.4814" x="596.62" y="1133.1214">3-second pause between rounds</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="146.7642" x="596.62" y="1143.721">Players can JOIN during exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="137.8257" x="596.62" y="1154.3206">Next round auto-starts after 3s</text></g><g class="entity" data-qualified-name="FIN" id="ent0007"><rect fill="#FFE082" height="83.5977" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="172.3979" x="606.8" y="178.3406"/><line style="stroke:#000000;stroke-width:1;" x1="606.8" x2="779.1979" y1="198.9402" y2="198.9402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.9497" x="675.5241" y="192.0418">finished</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="99.1802" x="611.8" y="212.6414">GAME_OVER broadcast</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="141.5786" x="611.8" y="223.241">Leaderboard + diamonds shown</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.1084" x="611.8" y="233.8406">Players click 'Play Again'</text><text fill="#008000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.6821" x="611.8" y="244.4402">resetForReplay() resets to 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="152.3979" x="611.8" y="255.0398">Host can REMOVE_ROOM (Task 41)</text></g><g class="end_entity" data-qualified-name="DEL" data-source-line="55" id="ent0008"><ellipse cx="136" cy="455.6406" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="136" cy="455.6406" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0002"><ellipse cx="1150" cy="220.1406" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="waiting" id="ent0003"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="51.6714" x="1124.16" y="430.6406"/><line style="stroke:#000000;stroke-width:1;" x1="1124.16" x2="1175.8314" y1="451.2402" y2="451.2402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="1134.16" y="444.3418">waiting</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="89" id="ent0003"><path d="M814.12,135.6406 L814.12,216.1406 L779.46,220.1406 L814.12,224.1406 L814.12,304.6348 A0,0 0 0 0 814.12,304.6348 L1037.8881,304.6348 A0,0 0 0 0 1037.8881,304.6348 L1037.8881,145.6406 L1027.8881,135.6406 L814.12,135.6406 A0,0 0 0 0 814.12,135.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1027.8881,135.6406 L1027.8881,145.6406 L1037.8881,145.6406 L1027.8881,135.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="202.7681" x="820.12" y="149.3418">Replay Flow (IMPLEMENTED &#8212; Task 35+36)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="820.12" y="159.9414">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.1768" x="820.12" y="170.541">1. endGame() sets state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="130.9482" x="820.12" y="181.1406">2. Client receives GAME_OVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.4946" x="820.12" y="191.7402">3. Player clicks 'Play Again'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.2085" x="820.12" y="202.3398">4. Client sends PLAY_AGAIN message</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="140.168" x="820.12" y="212.9395">5. Server: room.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.8486" x="828.663" y="223.5391">- state &#8594; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="144.4526" x="828.663" y="234.1387">- reset scores, alive, deck, hands</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.9048" x="828.663" y="244.7383">- keep players connected</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="141.0073" x="828.663" y="255.3379">- keep chat history (Task 35 fix)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="131.4141" x="828.663" y="265.9375">- keep bots alive (Task 36 fix)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.5239" x="820.12" y="276.5371">6. Server broadcasts ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="126.4175" x="820.12" y="287.1367">7. All clients re-render lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.9678" x="820.12" y="297.7363">8. Host starts new game when ready</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="107" id="ent0006"><path d="M622.29,606.6306 L622.29,724.2306 L588.03,728.2306 L622.29,732.2306 L622.29,849.822 A0,0 0 0 0 622.29,849.822 L817.7046,849.822 A0,0 0 0 0 817.7046,849.822 L817.7046,616.6306 L807.7046,606.6306 L622.29,606.6306 A0,0 0 0 0 622.29,606.6306" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M807.7046,606.6306 L807.7046,616.6306 L817.7046,616.6306 L807.7046,606.6306" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="168.8203" x="628.29" y="620.3318">Host Control Mode (countdown OFF)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="628.29" y="630.9314">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="34.2554" x="628.29" y="641.531">Toggle:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="115.8398" x="665.393" y="641.531">Host clicks toggle in lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="172.3008" x="628.29" y="652.1306">before starting game. Sets room option</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.9468" x="628.29" y="662.7302">countdownEnabled = false.</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="628.29" y="673.3298">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="64.7271" x="628.29" y="683.9295">During round:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.2534" x="628.29" y="694.5291">- No 10s timer runs</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="145.1074" x="628.29" y="705.1287">- Players guess at their own pace</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="169.6772" x="628.29" y="715.7283">- Host sees "Force Next Round" button</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="127.9424" x="628.29" y="726.3279">- allPlayed still auto-resolves</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="131.269" x="628.29" y="736.9275">- Host can force-resolve early</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="628.29" y="747.5271">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="42.6226" x="628.29" y="758.1267">Use case:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.9946" x="673.7602" y="758.1267">Teaching, demo, casual</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.3174" x="628.29" y="768.7263">play where time pressure unwanted.</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="628.29" y="779.3259">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="75.1816" x="628.29" y="789.9255">Implementation:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="168.5962" x="628.29" y="800.5252">- GameRoom: countdownEnabled field</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.665" x="628.29" y="811.1248">- startCountdown(): skip if !enabled</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="174.4146" x="628.29" y="821.7244">- New MSG: FORCE_RESOLVE (host only)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.4585" x="628.29" y="832.324">- UI: toggle switch in lobby settings</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="162.0088" x="628.29" y="842.9236">- UI: "Force Next Round" btn for host</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="132" id="ent0009"><path d="M181.65,397.6406 L181.65,513.6367 A0,0 0 0 0 181.65,513.6367 L360.3521,513.6367 A0,0 0 0 0 360.3521,513.6367 L360.3521,459.6406 L395.39,455.6406 L360.3521,451.6406 L360.3521,407.6406 L350.3521,397.6406 L181.65,397.6406 A0,0 0 0 0 181.65,397.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M350.3521,397.6406 L350.3521,407.6406 L360.3521,407.6406 L350.3521,397.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="111.0278" x="187.65" y="411.3418">Join guards (addPlayer):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="154.0503" x="187.65" y="421.9414">- size &gt;= maxPlayers &#8594; reject [R7]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.4521" x="187.65" y="432.541">- state !== 'waiting' AND</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.3921" x="193.3453" y="443.1406">state !== 'exchange' &#8594; reject [R9]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.1963" x="187.65" y="453.7402">- state === 'exchange' &#8594; OK [R8]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="187.65" y="464.3398">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="126.3691" x="187.65" y="474.9395">Replay bypasses join guards:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="157.7021" x="187.65" y="485.5391">resetForReplay() sets state='waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="153.0703" x="187.65" y="496.1387">so existing players stay connected,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="76.7637" x="187.65" y="506.7383">no rejoin needed.</text></g><!--link *start* to waiting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="8" id="lnk4"><path d="M1150,230.5806 C1150,264.2806 1150,373.3406 1150,424.1606" fill="none" id="*start*-to-waiting" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1150,430.1606,1154,421.1606,1150,425.1606,1146,421.1606,1150,430.1606" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="60.3193" x="1182.4626" y="349.3418">Room created</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.2446" x="1151" y="359.9414">(RoomManager.createRoom)</text></g><!--link FIN to DEL-->