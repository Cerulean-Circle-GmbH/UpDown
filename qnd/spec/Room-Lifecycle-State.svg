<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1333px" preserveAspectRatio="none" style="width:1306px;height:1333px;background:#FFFFFF;" version="1.1" viewBox="0 0 1306 1333" width="1306px" zoomAndPan="magnify"><title>UpDown QnD &#8212; Room State Machine
States: waiting &#8594; countdown/hostControl &#8594; revealing &#8594; exchange &#8594; finished &#8594; waiting
&lt;color:green&gt;FIXED (Task 35): resetForReplay() returns room to 'waiting'&lt;/color&gt;
&lt;color:blue&gt;Task 37: Host can toggle countdown OFF &#8594; manual 'Force Next Round'&lt;/color&gt;</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="418.3652" x="439.4397" y="36.2695">UpDown QnD &#8212; Room State Machine</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="1008.3799" x="144.4324" y="62.1797">States: waiting &#8594; countdown/hostControl &#8594; revealing &#8594; exchange &#8594; finished &#8594; waiting</text><text fill="#008000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="667.4658" x="314.8894" y="88.0898">FIXED (Task 35): resetForReplay() returns room to 'waiting'</text><text fill="#0000FF" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="803.2256" x="247.0095" y="114">Task 37: Host can toggle countdown OFF &#8594; manual 'Force Next Round'</text></g><g class="entity" data-qualified-name="W" id="ent0002"><rect fill="#A5D6A7" height="104.7969" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="190.666" x="246.67" y="393.2406"/><line style="stroke:#000000;stroke-width:1;" x1="246.67" x2="437.336" y1="413.8402" y2="413.8402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="326.1673" y="406.9418">waiting</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="94.8252" x="251.67" y="427.5414">Players can join/leave</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.251" x="251.67" y="438.141">Host can add bots</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.7764" x="251.67" y="448.7406">Host can start game</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="170.666" x="251.67" y="459.3402">Lobby countdown (30s) may auto-start</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.5083" x="251.67" y="469.9398">host.toggleCountdown()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.998" x="251.67" y="480.5395">sets countdownEnabled on/off</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="91.6787" x="251.67" y="491.1391">before starting game</text></g><g class="entity" data-qualified-name="CD" id="ent0003"><rect fill="#FFE082" height="83.5977" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="414.46" y="1244.2206"/><line style="stroke:#000000;stroke-width:1;" x1="414.46" x2="595.5459" y1="1264.8202" y2="1264.8202"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="48.3882" x="480.8089" y="1257.9218">countdown</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.3882" x="419.46" y="1278.5214">10-second round timer</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="419.46" y="1289.121">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="419.46" y="1299.7206">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="119.3203" x="419.46" y="1310.3202">Timer ticks broadcast to all</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="113.2646" x="419.46" y="1320.9198">countdownEnabled = true</text></g><g class="entity" data-qualified-name="HC" id="ent0004"><rect fill="#E1BEE7" height="94.1973" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="181.0859" x="391.46" y="671.1306"/><line style="stroke:#000000;stroke-width:1;" x1="391.46" x2="572.5459" y1="691.7302" y2="691.7302"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="51.5874" x="456.2093" y="684.8318">hostControl</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.2993" x="396.46" y="705.4314">No timer &#8212; host controls pace</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.0859" x="396.46" y="716.031">Players submit guesses (PLAY_CARD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.5796" x="396.46" y="726.6306">Players play special cards</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="159.0205" x="396.46" y="737.2302">Host sees 'Force Next Round' button</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.8994" x="396.46" y="747.8298">Auto-resolve when allPlayed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.0991" x="396.46" y="758.4295">countdownEnabled = false</text></g><g class="entity" data-qualified-name="RV" id="ent0005"><rect fill="#FFF3E0" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="134.8423" x="645.58" y="932.8306"/><line style="stroke:#000000;stroke-width:1;" x1="645.58" x2="780.4223" y1="953.4302" y2="953.4302"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="39.7397" x="693.1313" y="946.5318">revealing</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.6538" x="650.58" y="967.1314">Round resolved</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="75.1113" x="650.58" y="977.731">Scores calculated</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="100.5117" x="650.58" y="988.3306">Eliminations processed</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="114.8423" x="650.58" y="998.9302">ROUND_RESULT broadcast</text></g><g class="entity" data-qualified-name="EX" id="ent0006"><rect fill="#E3F2FD" height="62.3984" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="166.7642" x="591.62" y="1088.8206"/><line style="stroke:#000000;stroke-width:1;" x1="591.62" x2="758.3842" y1="1109.4202" y2="1109.4202"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.9106" x="654.0468" y="1102.5218">exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="143.4814" x="596.62" y="1123.1214">3-second pause between rounds</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="146.7642" x="596.62" y="1133.721">Players can JOIN during exchange</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="137.8257" x="596.62" y="1144.3206">Next round auto-starts after 3s</text></g><g class="entity" data-qualified-name="FIN" id="ent0007"><rect fill="#FFE082" height="72.998" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="169.6821" x="700.16" y="183.6406"/><line style="stroke:#000000;stroke-width:1;" x1="700.16" x2="869.8421" y1="204.2402" y2="204.2402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.9497" x="767.5262" y="197.3418">finished</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="99.1802" x="705.16" y="217.9414">GAME_OVER broadcast</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="141.5786" x="705.16" y="228.541">Leaderboard + diamonds shown</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.1084" x="705.16" y="239.1406">Players click 'Play Again'</text><text fill="#008000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.6821" x="705.16" y="249.7402">resetForReplay() resets to 'waiting'</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="8" id="ent0002"><ellipse cx="1174" cy="220.1406" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="waiting" id="ent0003"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="51.6714" x="1148.16" y="420.6406"/><line style="stroke:#000000;stroke-width:1;" x1="1148.16" x2="1199.8314" y1="441.2402" y2="441.2402"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="31.6714" x="1158.16" y="434.3418">waiting</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="83" id="ent0003"><path d="M905.12,135.6406 L905.12,216.1406 L870.19,220.1406 L905.12,224.1406 L905.12,304.6348 A0,0 0 0 0 905.12,304.6348 L1128.8881,304.6348 A0,0 0 0 0 1128.8881,304.6348 L1128.8881,145.6406 L1118.8881,135.6406 L905.12,135.6406 A0,0 0 0 0 905.12,135.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1118.8881,135.6406 L1118.8881,145.6406 L1128.8881,145.6406 L1118.8881,135.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="202.7681" x="911.12" y="149.3418">Replay Flow (IMPLEMENTED &#8212; Task 35+36)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="911.12" y="159.9414">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.1768" x="911.12" y="170.541">1. endGame() sets state='finished'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="130.9482" x="911.12" y="181.1406">2. Client receives GAME_OVER</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="116.4946" x="911.12" y="191.7402">3. Player clicks 'Play Again'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.2085" x="911.12" y="202.3398">4. Client sends PLAY_AGAIN message</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="140.168" x="911.12" y="212.9395">5. Server: room.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.8486" x="919.663" y="223.5391">- state &#8594; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="144.4526" x="919.663" y="234.1387">- reset scores, alive, deck, hands</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.9048" x="919.663" y="244.7383">- keep players connected</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="141.0073" x="919.663" y="255.3379">- keep chat history (Task 35 fix)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="131.4141" x="919.663" y="265.9375">- keep bots alive (Task 36 fix)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.5239" x="911.12" y="276.5371">6. Server broadcasts ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="126.4175" x="911.12" y="287.1367">7. All clients re-render lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.9678" x="911.12" y="297.7363">8. Host starts new game when ready</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="101" id="ent0006"><path d="M607.29,596.6306 L607.29,714.2306 L573.03,718.2306 L607.29,722.2306 L607.29,839.822 A0,0 0 0 0 607.29,839.822 L802.7046,839.822 A0,0 0 0 0 802.7046,839.822 L802.7046,606.6306 L792.7046,596.6306 L607.29,596.6306 A0,0 0 0 0 607.29,596.6306" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M792.7046,596.6306 L792.7046,606.6306 L802.7046,606.6306 L792.7046,596.6306" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="168.8203" x="613.29" y="610.3318">Host Control Mode (countdown OFF)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="613.29" y="620.9314">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="34.2554" x="613.29" y="631.531">Toggle:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="115.8398" x="650.393" y="631.531">Host clicks toggle in lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="172.3008" x="613.29" y="642.1306">before starting game. Sets room option</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.9468" x="613.29" y="652.7302">countdownEnabled = false.</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="613.29" y="663.3298">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="64.7271" x="613.29" y="673.9295">During round:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="87.2534" x="613.29" y="684.5291">- No 10s timer runs</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="145.1074" x="613.29" y="695.1287">- Players guess at their own pace</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="169.6772" x="613.29" y="705.7283">- Host sees "Force Next Round" button</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="127.9424" x="613.29" y="716.3279">- allPlayed still auto-resolves</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="131.269" x="613.29" y="726.9275">- Host can force-resolve early</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="613.29" y="737.5271">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="42.6226" x="613.29" y="748.1267">Use case:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.9946" x="658.7602" y="748.1267">Teaching, demo, casual</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.3174" x="613.29" y="758.7263">play where time pressure unwanted.</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="613.29" y="769.3259">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="75.1816" x="613.29" y="779.9255">Implementation:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="168.5962" x="613.29" y="790.5252">- GameRoom: countdownEnabled field</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.665" x="613.29" y="801.1248">- startCountdown(): skip if !enabled</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="174.4146" x="613.29" y="811.7244">- New MSG: FORCE_RESOLVE (host only)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.4585" x="613.29" y="822.324">- UI: toggle switch in lobby settings</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="162.0088" x="613.29" y="832.9236">- UI: "Force Next Round" btn for host</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="126" id="ent0009"><path d="M32.65,387.6406 L32.65,503.6367 A0,0 0 0 0 32.65,503.6367 L211.3521,503.6367 A0,0 0 0 0 211.3521,503.6367 L211.3521,449.6406 L246.39,445.6406 L211.3521,441.6406 L211.3521,397.6406 L201.3521,387.6406 L32.65,387.6406 A0,0 0 0 0 32.65,387.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M201.3521,387.6406 L201.3521,397.6406 L211.3521,397.6406 L201.3521,387.6406" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="111.0278" x="38.65" y="401.3418">Join guards (addPlayer):</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="154.0503" x="38.65" y="411.9414">- size &gt;= maxPlayers &#8594; reject [R7]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="110.4521" x="38.65" y="422.541">- state !== 'waiting' AND</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="149.3921" x="44.3453" y="433.1406">state !== 'exchange' &#8594; reject [R9]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.1963" x="38.65" y="443.7402">- state === 'exchange' &#8594; OK [R8]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="38.65" y="454.3398">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="126.3691" x="38.65" y="464.9395">Replay bypasses join guards:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="157.7021" x="38.65" y="475.5391">resetForReplay() sets state='waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="153.0703" x="38.65" y="486.1387">so existing players stay connected,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="76.7637" x="38.65" y="496.7383">no rejoin needed.</text></g><!--link *start* to waiting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="8" id="lnk4"><path d="M1174,230.4606 C1174,262.8406 1174,365.1906 1174,414.1906" fill="none" id="*start*-to-waiting" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1174,420.1906,1178,411.1906,1174,415.1906,1170,411.1906,1174,420.1906" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="60.3193" x="1206.4626" y="344.3418">Room created</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="123.2446" x="1175" y="354.9414">(RoomManager.createRoom)</text></g><!--link W to CD--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="54" id="lnk5"><path d="M298.82,498.3906 C259.98,550.3006 209,634.2606 209,717.2306 C209,717.2306 209,717.2306 209,1121.0206 C209,1216.0506 321.2798,1255.3179 408.2898,1272.1979" fill="none" id="W-to-CD" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="414.18,1273.3406,406.1065,1267.6998,409.2715,1272.3884,404.5829,1275.5534,414.18,1