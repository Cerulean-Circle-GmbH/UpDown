<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1008px" preserveAspectRatio="none" style="width:2026px;height:1008px;background:#FFFFFF;" version="1.1" viewBox="0 0 2026 1008" width="2026px" zoomAndPan="magnify"><title>UpDown QnD &#8212; Room Replay Flow
Current (broken) vs Correct (designed)</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="396.9668" x="810.2116" y="36.2695">UpDown QnD &#8212; Room Replay Flow</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="440.1074" x="788.6413" y="62.1797">Current (broken) vs Correct (designed)</text></g><!--cluster BROKEN--><g class="cluster" data-qualified-name="BROKEN" data-source-line="17" id="ent0004"><rect fill="#FFCDD2" height="180" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="1647.32" x="93.46" y="822.8203"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="120.5376" x="856.8512" y="833.5215">CURRENT FLOW (BROKEN)</text></g><!--cluster CORRECT--><g class="cluster" data-qualified-name="CORRECT" data-source-line="42" id="ent0021"><rect fill="#E8F5E9" height="213" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="1621.75" x="398.64" y="569.8203"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="117.1099" x="1150.9601" y="580.5215">CORRECT FLOW (DESIGN)</text></g><!--cluster IMPL--><g class="cluster" data-qualified-name="IMPL" data-source-line="75" id="ent0039"><rect fill="#FFF3E0" height="252" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="580.24" x="50.55" y="84.8203"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="115.7476" x="282.7962" y="95.5215">Implementation Changes</text></g><!--entity B1--><g class="entity" data-qualified-name="BROKEN.B1" data-source-line="18" id="ent0005"><ellipse cx="165.0868" cy="918.8227" fill="#FFFFFF" rx="47.6368" ry="17.0123" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="45.7295" x="142.222" y="913.8879">game.over</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.5308" x="131.3214" y="924.4875">state='finished'</text></g><!--entity B2--><g class="entity" data-qualified-name="BROKEN.B2" data-source-line="19" id="ent0006"><ellipse cx="513.2782" cy="884.8167" fill="#FFFFFF" rx="62.4782" ry="16.7964" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="91.3931" x="467.5817" y="883.0852">player.clickPlayAgain</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="52.708" x="486.9242" y="893.6848">(client-side)</text></g><!--entity B3--><g class="entity" data-qualified-name="BROKEN.B3" data-source-line="20" id="ent0007"><ellipse cx="801.5961" cy="884.8172" fill="#EF9A9A" rx="72.1961" ry="17.2669" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.8882" x="761.652" y="880.267">client.leaveRoom()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.8188" x="750.1867" y="890.8666">&#8592; WRONG: disconnects</text></g><!--entity B4--><g class="entity" data-qualified-name="BROKEN.B4" data-source-line="21" id="ent0008"><ellipse cx="1063.9809" cy="885.8249" fill="#FFFFFF" rx="64.9209" ry="17.0846" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="93.1992" x="1017.3813" y="883.6496">client.onLeaveRoom()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="65.9092" x="1031.0263" y="894.2492">shows lobby UI</text></g><!--entity B5--><g class="entity" data-qualified-name="BROKEN.B5" data-source-line="22" id="ent0009"><ellipse cx="1323.688" cy="885.8241" fill="#EF9A9A" rx="74.308" ry="17.3538" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="85.0737" x="1281.1511" y="881.4034">setTimeout(500ms)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.3149" x="1271.0305" y="892.003">client.joinRoom(sameId)</text></g><!--entity B6--><g class="entity" data-qualified-name="BROKEN.B6" data-source-line="23" id="ent0010"><ellipse cx="1641.0709" cy="885.8225" fill="#EF9A9A" rx="75.7109" ry="17.5422" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="77.5854" x="1602.2781" y="880.6225">server.addPlayer()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="115.0093" x="1583.5662" y="891.2221">REJECTED: state='finished'</text></g><!--entity B7--><g class="entity" data-qualified-name="BROKEN.B7" data-source-line="25" id="ent0011"><ellipse cx="513.2752" cy="956.8154" fill="#FFE082" rx="83.8252" ry="19.165" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="128.5884" x="448.9811" y="954.1191">PRESET ROOMS: autoRecreate</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="114.5742" x="455.9881" y="964.7187">deletes room, creates new</text></g><!--entity B8--><g class="entity" data-qualified-name="BROKEN.B8" data-source-line="26" id="ent0012"><ellipse cx="801.5969" cy="957.8169" fill="#EF9A9A" rx="62.8269" ry="20.9966" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.0518" x="768.071" y="950.0111">Race condition:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.7104" x="748.7416" y="960.6107">new room may not exist</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.2471" x="780.9733" y="971.2103">at 500ms</text></g><!--entity C1--><g class="entity" data-qualified-name="CORRECT.C1" data-source-line="44" id="ent0022"><ellipse cx="513.2759" cy="650.8229" fill="#A5D6A7" rx="90.6459" ry="24.5526" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="129.3135" x="448.6191" y="643.3718">UC-GE5: game.end.playAgain</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="48.876" x="488.8379" y="653.9714">[ea33c5b7]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.1084" x="460.7217" y="664.5711">Player clicks 'Play Again'</text></g><!--entity C2--><g class="entity" data-qualified-name="CORRECT.C2" data-source-line="46" id="ent0023"><ellipse cx="801.6019" cy="650.8205" fill="#A5D6A7" rx="76.9819" ry="24.1502" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="95.5591" x="753.8224" y="641.7723">client.sendPlayAgain()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="111.23" x="745.9869" y="652.3719">NO leaveRoom, NO rejoin</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="99.5229" x="751.8405" y="662.9715">player stays connected</text></g><!--entity C3--><g class="entity" data-qualified-name="CORRECT.C3" data-source-line="48" id="ent0024"><ellipse cx="1063.9832" cy="650.8209" fill="#A5D6A7" rx="82.4032" ry="18.8806" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="106.9893" x="1010.4886" y="646.1848">server.handlePlayAgain()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="127.5293" x="1000.2185" y="656.7844">room.votePlayAgain(playerId)</text></g><!--entity C4--><g class="entity" data-qualified-name="CORRECT.C4" data-source-line="50" id="ent0025"><ellipse cx="1323.689" cy="650.8155" fill="#A5D6A7" rx="64.459" ry="16.5452" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.1875" x="1275.5952" y="649.4818">room.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.0933" x="1303.1423" y="660.0814">&#171;include&#187;</text></g><!--entity C4a--><g class="entity" data-qualified-name="CORRECT.C4a" data-source-line="52" id="ent0026"><ellipse cx="1641.0653" cy="648.8215" fill="#E8F5E9" rx="91.0653" ry="23.1512" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.3062" x="1592.9123" y="639.0491">reset state &#8594; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="138.9683" x="1571.5812" y="649.6487">reset scores/alive/hands/round</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.3228" x="1581.904" y="660.2483">keep players + chat + host</text></g><!--entity C5--><g class="entity" data-qualified-name="CORRECT.C5" data-source-line="54" id="ent0027"><ellipse cx="1641.0686" cy="731.8197" fill="#A5D6A7" rx="74.1286" ry="24.7894" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="103.8032" x="1589.167" y="724.0201">broadcast ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="93.8804" x="1594.1285" y="734.6197">all clients show lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="89.7979" x="1596.1697" y="745.2193">with same player list</text></g><!--entity C6--><g class="entity" data-qualified-name="CORRECT.C6" data-source-line="56" id="ent0028"><ellipse cx="1919.0763" cy="686.8195" fill="#A5D6A7" rx="77.3063" ry="24.8392" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="108.1934" x="1864.9796" y="678.9472">UC-G1: host.startGame()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="50.6338" x="1893.7594" y="689.5468">[560d9a46]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="94.7329" x="1871.7098" y="700.1464">Host starts new game</text></g><!--entity C7--><g class="entity" data-qualified-name="CORRECT.C7" data-source-line="58" id="ent0029"><ellipse cx="513.2774" cy="734.8229" fill="#A5D6A7" rx="87.4174" ry="24.4226" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="98.0332" x="464.2608" y="724.4812">UC-R10: player.leave()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="47.2148" x="489.67" y="735.0808">[96f2ecd5]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="125.3057" x="450.6246" y="745.6804">Player leaves (Back to Lobby)</text></g><!--entity I1--><g class="entity" data-qualified-name="IMPL.I1" data-source-line="76" id="ent0040"><ellipse cx="165.0943" cy="296.8176" fill="#FFFFFF" rx="98.5443" ry="23.5273" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="148.0078" x="91.0904" y="290.9334">NEW: GameRoom.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="103.8164" x="113.1861" y="301.5331">reset state/scores/deck</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="76.4033" x="126.8927" y="312.1327">keep connections</text></g><!--entity I2--><g class="entity" data-qualified-name="IMPL.I2" data-source-line="77" id="ent0041"><ellipse cx="165.0892" cy="220.8156" fill="#FFFFFF" rx="74.3892" ry="17.9653" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="101.127" x="114.5257" y="217.3507">NEW: MSG.PLAY_AGAIN</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="100.4546" x="114.8619" y="227.9503">client&#8594;server message</text></g><!--entity I3--><g class="entity" data-qualified-name="IMPL.I3" data-source-line="78" id="ent0042"><ellipse cx="165.0929" cy="149.8217" fill="#FFFFFF" rx="77.3729" ry="17.9714" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="104.7832" x="112.7013" y="146.2952">NEW: MSG.ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.3105" x="112.4376" y="156.8949">server&#8594;client broadcast</text></g><!--entity I4--><g class="entity" data-qualified-name="IMPL.I4" data-source-line="79" id="ent0043"><ellipse cx="513.2808" cy="298.8185" fill="#FFFFFF" rx="97.8908" ry="21.9782" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="158.6997" x="433.9309" y="295.5107">FIX: MultiplayerUI.renderGameOver()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.1113" x="435.2251" y="306.1103">send PLAY_AGAIN, don't leaveRoom</text></g><!--entity I5--><g class="entity" data-qualified-name="IMPL.I5" data-source-line="80" id="ent0044"><ellipse cx="513.278" cy="217.8187" fill="#FFFFFF" rx="89.718" ry="23.6684" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="133.418" x="446.569" y="211.7126">FIX: endGame() for user rooms</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="118.3931" x="454.0815" y="222.3122">don't auto-delete after 60s</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="75.7441" x="475.406" y="232.9118">if players present</text></g><!--entity I6--><g class="entity" data-qualified-name="IMPL.I6" data-source-line="81" id="ent0045"><ellipse cx="513.2808" cy="136.8225" fill="#FFFFFF" rx="101.5108" ry="22.7022" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="169.2378" x="428.6619" y="133.8344">NEW: MultiplayerUI.handleRoomReset()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="162.6987" x="431.9315" y="144.434">re-render lobby with existing players</text></g><!--entity player--><g class="entity" data-qualified-name="player" data-source-line="10" id="ent0002"><ellipse cx="165.09" cy="722.0203" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:1;"/><path d="M165.09,730.0203 L165.09,757.0203 M152.09,738.0203 L178.09,738.0203 M165.09,757.0203 L152.09,772.0203 M165.09,757.0203 L178.09,772.0203" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="25.9453" x="152.1173" y="782.7215">Player</text></g><!--entity host--><g class="entity" data-qualified-name="host" data-source-line="11" id="ent0003"><ellipse cx="1641.07" cy="483.0203" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:1;"/><path d="M1641.07,491.0203 L1641.07,518.0203 M1628.07,499.0203 L1654.07,499.0203 M1641.07,518.0203 L1628.07,533.0203 M1641.07,518.0203 L1654.07,533.0203" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="20.0962" x="1631.0219" y="543.7215">Host</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="85" id="ent0047"><path d="M404.95,355.7203 L404.95,545.9137 L621.6121,545.9137 L621.6121,365.7203 L611.6121,355.7203 L404.95,355.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M611.6121,355.7203 L611.6121,365.7203 L621.6121,365.7203 L611.6121,355.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="82.8809" x="410.95" y="369.4215">Design Principles:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="195.6621" x="410.95" y="380.0211">P6: resetForReplay() resets model, not object</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="180.4175" x="410.95" y="390.6207">P1: Room IS its scenario &#8212; reset scenario</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="146.3599" x="410.95" y="401.2203">P11: No protocol knowledge in UI</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="166.5923" x="410.95" y="411.8199">P4: Room resets itself (polymorphism)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="410.95" y="422.4195">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="129.1772" x="410.95" y="433.0191">What resetForReplay() does:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.9917" x="410.95" y="443.6188">- this.state = 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="71.6309" x="410.95" y="454.2184">- this.round = 0</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.4951" x="410.95" y="464.818">- this.deck = createShuffledDeck()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="82.5952" x="410.95" y="475.4176">- this.gmHand = []</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="108.3384" x="410.95" y="486.0172">- this.currentCard = null</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="164.9224" x="410.95" y="496.6168">- players.forEach: score=0, streak=0,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="134.5254" x="416.6453" y="507.2164">alive=true, currentGuess=null,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="147.1597" x="416.6453" y="517.816">roundsPlayed=0, inventory=fresh</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="145.3184" x="410.95" y="528.4156">- keep: players Map, chatHistory,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="103.2407" x="416.6453" y="539.0152">hostId, spectators, bots</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="105" id="ent0050"><path d="M70.79,593.7203 L70.79,677.9176 L259.4018,677.9176 L259.4018,603.7203 L249.4018,593.7203 L70.79,593.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M249.4018,593.7203 L249.4018,603.7203 L259.4018,603.7203 L249.4018,593.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="57.9858" x="76.79" y="607.4215">Root causes:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="151.1895" x="76.79" y="618.0211">1. No PLAY_AGAIN server message</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="153.8789" x="76.79" y="628.6207">2. Client does leave+rejoin (wrong)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="160.9629" x="76.79" y="639.2203">3. state='finished' blocks addPlayer()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="157.6714" x="76.79" y="649.8199">4. User rooms auto-delete after 60s</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="167.6118" x="76.79" y="660.4195">5. Preset rooms delete+recreate (race)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.543" x="76.79" y="671.0191">6. No resetForReplay() method exists</text></g><!--link player to B2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="29" id="lnk13"><path d="M179.24,753.9903 C228.21,773.2203 395.4856,838.9362 470.9756,868.5962" fill="none" id="player-to-B2" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="476.56,870.7903,469.6461,863.7762,471.9063,868.9619,466.7206,871.2221,476.56,870.7903" style="stroke:#000000;stroke-width:1;"/></g><!--link B1 to B2--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="30" id="lnk14"><path d="M211.35,914.3803 C273.57,908.2603 379.6187,897.8468 448.0387,891.1268" fill="none" id="B1-to-B2" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="454.01,890.5403,444.6621,887.4392,449.0339,891.029,445.4441,895.4009,454.01,890.5403" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" le