<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="987px" preserveAspectRatio="none" style="width:2031px;height:987px;background:#FFFFFF;" version="1.1" viewBox="0 0 2031 987" width="2031px" zoomAndPan="magnify"><title>UpDown QnD &#8212; Room Replay Flow
Current (broken) vs Correct (designed)</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="396.9668" x="812.9766" y="36.2695">UpDown QnD &#8212; Room Replay Flow</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="440.1074" x="791.4063" y="62.1797">Current (broken) vs Correct (designed)</text></g><!--cluster BROKEN--><g class="cluster" data-qualified-name="BROKEN" data-source-line="17" id="ent0004"><rect fill="#FFCDD2" height="180" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="1653.79" x="84.46" y="801.8203"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="120.5376" x="851.0862" y="812.5215">CURRENT FLOW (BROKEN)</text></g><!--cluster CORRECT--><g class="cluster" data-qualified-name="CORRECT" data-source-line="42" id="ent0021"><rect fill="#E8F5E9" height="213" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="1640.52" x="385.4" y="548.8203"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="220.4604" x="1095.4298" y="559.5215">CORRECT FLOW (IMPLEMENTED &#8212; Task 35+36)</text></g><!--cluster IMPL--><g class="cluster" data-qualified-name="IMPL" data-source-line="75" id="ent0039"><rect fill="#E8F5E9" height="231" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="542.94" x="50.19" y="84.8203"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="129.5244" x="256.8978" y="95.5215">Implementation (ALL DONE)</text></g><!--entity B1--><g class="entity" data-qualified-name="BROKEN.B1" data-source-line="18" id="ent0005"><ellipse cx="156.0968" cy="898.8227" fill="#FFFFFF" rx="47.6368" ry="17.0123" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="45.7295" x="133.232" y="893.8879">game.over</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.5308" x="122.3314" y="904.4875">state='finished'</text></g><!--entity B2--><g class="entity" data-qualified-name="BROKEN.B2" data-source-line="19" id="ent0006"><ellipse cx="500.0482" cy="938.8167" fill="#FFFFFF" rx="62.4782" ry="16.7964" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="91.3931" x="454.3517" y="937.0852">player.clickPlayAgain</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="52.708" x="473.6942" y="947.6848">(client-side)</text></g><!--entity B3--><g class="entity" data-qualified-name="BROKEN.B3" data-source-line="20" id="ent0007"><ellipse cx="788.3561" cy="940.8172" fill="#EF9A9A" rx="72.1961" ry="17.2669" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="79.8882" x="748.412" y="936.267">client.leaveRoom()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="102.8188" x="736.9467" y="946.8666">&#8592; WRONG: disconnects</text></g><!--entity B4--><g class="entity" data-qualified-name="BROKEN.B4" data-source-line="21" id="ent0008"><ellipse cx="1050.7509" cy="940.8249" fill="#FFFFFF" rx="64.9209" ry="17.0846" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="93.1992" x="1004.1513" y="938.6496">client.onLeaveRoom()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="65.9092" x="1017.7963" y="949.2492">shows lobby UI</text></g><!--entity B5--><g class="entity" data-qualified-name="BROKEN.B5" data-source-line="22" id="ent0009"><ellipse cx="1310.458" cy="931.8241" fill="#EF9A9A" rx="74.308" ry="17.3538" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="85.0737" x="1267.9211" y="927.4034">setTimeout(500ms)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.3149" x="1257.8005" y="938.003">client.joinRoom(sameId)</text></g><!--entity B6--><g class="entity" data-qualified-name="BROKEN.B6" data-source-line="23" id="ent0010"><ellipse cx="1638.5409" cy="922.8225" fill="#EF9A9A" rx="75.7109" ry="17.5422" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="77.5854" x="1599.7481" y="917.6225">server.addPlayer()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="115.0093" x="1581.0362" y="928.2221">REJECTED: state='finished'</text></g><!--entity B7--><g class="entity" data-qualified-name="BROKEN.B7" data-source-line="25" id="ent0011"><ellipse cx="500.0452" cy="867.8154" fill="#FFE082" rx="83.8252" ry="19.165" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="128.5884" x="435.7511" y="865.1191">PRESET ROOMS: autoRecreate</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="114.5742" x="442.7581" y="875.7187">deletes room, creates new</text></g><!--entity B8--><g class="entity" data-qualified-name="BROKEN.B8" data-source-line="26" id="ent0012"><ellipse cx="788.3569" cy="867.8169" fill="#EF9A9A" rx="62.8269" ry="20.9966" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="67.0518" x="754.831" y="860.0111">Race condition:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.7104" x="735.5016" y="870.6107">new room may not exist</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.2471" x="767.7333" y="881.2103">at 500ms</text></g><!--entity C1--><g class="entity" data-qualified-name="CORRECT.C1" data-source-line="44" id="ent0022"><ellipse cx="500.0459" cy="629.8229" fill="#A5D6A7" rx="90.6459" ry="24.5526" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="129.3135" x="435.3891" y="622.3718">UC-GE5: game.end.playAgain</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="48.876" x="475.6079" y="632.9714">[ea33c5b7]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="105.1084" x="447.4917" y="643.5711">Player clicks 'Play Again'</text></g><!--entity C2--><g class="entity" data-qualified-name="CORRECT.C2" data-source-line="46" id="ent0023"><ellipse cx="788.3619" cy="629.8205" fill="#A5D6A7" rx="76.9819" ry="24.1502" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="95.5591" x="740.5824" y="620.7723">client.sendPlayAgain()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="111.23" x="732.7469" y="631.3719">NO leaveRoom, NO rejoin</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="99.5229" x="738.6005" y="641.9715">player stays connected</text></g><!--entity C3--><g class="entity" data-qualified-name="CORRECT.C3" data-source-line="48" id="ent0024"><ellipse cx="1050.7532" cy="629.8209" fill="#A5D6A7" rx="82.4032" ry="18.8806" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="106.9893" x="997.2586" y="625.1848">server.handlePlayAgain()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="127.5293" x="986.9885" y="635.7844">room.votePlayAgain(playerId)</text></g><!--entity C4--><g class="entity" data-qualified-name="CORRECT.C4" data-source-line="50" id="ent0025"><ellipse cx="1310.459" cy="629.8155" fill="#A5D6A7" rx="64.459" ry="16.5452" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.1875" x="1262.3652" y="628.4818">room.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="41.0933" x="1289.9123" y="639.0814">&#171;include&#187;</text></g><!--entity C4a--><g class="entity" data-qualified-name="CORRECT.C4a" data-source-line="52" id="ent0026"><ellipse cx="1638.5401" cy="713.8243" fill="#E8F5E9" rx="101.7701" ry="23.894" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.3062" x="1590.387" y="702.6812">reset state &#8594; 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="138.9683" x="1569.056" y="713.2808">reset scores/alive/hands/round</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.3193" x="1563.3804" y="723.8804">keep players + chat + host + bots</text></g><!--entity C5--><g class="entity" data-qualified-name="CORRECT.C5" data-source-line="54" id="ent0027"><ellipse cx="1638.5386" cy="629.8197" fill="#A5D6A7" rx="74.1286" ry="24.7894" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="103.8032" x="1586.637" y="622.0201">broadcast ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="93.8804" x="1591.5985" y="632.6197">all clients show lobby</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="89.7979" x="1593.6397" y="643.2193">with same player list</text></g><!--entity C6--><g class="entity" data-qualified-name="CORRECT.C6" data-source-line="56" id="ent0028"><ellipse cx="1924.6063" cy="629.8195" fill="#A5D6A7" rx="77.3063" ry="24.8392" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="108.1934" x="1870.5096" y="621.9472">UC-G1: host.startGame()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="50.6338" x="1899.2894" y="632.5468">[560d9a46]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="94.7329" x="1877.2398" y="643.1464">Host starts new game</text></g><!--entity C7--><g class="entity" data-qualified-name="CORRECT.C7" data-source-line="58" id="ent0029"><ellipse cx="500.0474" cy="713.8229" fill="#A5D6A7" rx="87.4174" ry="24.4226" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="98.0332" x="451.0308" y="703.4812">UC-R10: player.leave()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="47.2148" x="476.44" y="714.0808">[96f2ecd5]</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="125.3057" x="437.3946" y="724.6804">Player leaves (Back to Lobby)</text></g><!--entity I1--><g class="entity" data-qualified-name="IMPL.I1" data-source-line="76" id="ent0040"><ellipse cx="156.1027" cy="281.8248" fill="#A5D6A7" rx="79.0227" ry="18.2045" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="137.9341" x="87.1356" y="282.5276">&#9989; GameRoom.resetForReplay()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.7388" x="138.7333" y="293.1272">Task 35</text></g><!--entity I2--><g class="entity" data-qualified-name="IMPL.I2" data-source-line="77" id="ent0041"><ellipse cx="156.096" cy="208.8175" fill="#A5D6A7" rx="88.136" ry="20.0272" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.814" x="75.189" y="210.6173">&#9989; MSG.PLAY_AGAIN + ROOM_RESET</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.7388" x="138.7266" y="221.2169">Task 35</text></g><!--entity I4--><g class="entity" data-qualified-name="IMPL.I4" data-source-line="78" id="ent0042"><ellipse cx="156.1035" cy="133.823" fill="#A5D6A7" rx="89.9135" ry="20.3827" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="157.6084" x="77.2993" y="133.5909">&#9989; MultiplayerUI sends PLAY_AGAIN</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="104.8096" x="103.6987" y="144.1905">(no leaveRoom) Task 35</text></g><!--entity I5--><g class="entity" data-qualified-name="IMPL.I5" data-source-line="79" id="ent0043"><ellipse cx="500.0469" cy="281.8157" fill="#A5D6A7" rx="77.0769" ry="17.8154" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="124.2715" x="437.9111" y="280.8492">&#9989; Chat preserved on replay</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="68.5679" x="465.7629" y="291.4488">chat fix commit</text></g><!--entity I6--><g class="entity" data-qualified-name="IMPL.I6" data-source-line="80" id="ent0044"><ellipse cx="500.0503" cy="212.8181" fill="#A5D6A7" rx="64.3403" ry="16.4578" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.6255" x="451.7376" y="211.6255">&#9989; Bots survive replay</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="34.7388" x="482.681" y="222.2251">Task 36</text></g><!--entity player--><g class="entity" data-qualified-name="player" data-source-line="10" id="ent0002"><ellipse cx="156.1" cy="701.0203" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:1;"/><path d="M156.1,709.0203 L156.1,736.0203 M143.1,717.0203 L169.1,717.0203 M156.1,736.0203 L143.1,751.0203 M156.1,736.0203 L169.1,751.0203" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="25.9453" x="143.1273" y="761.7215">Player</text></g><!--entity host--><g class="entity" data-qualified-name="host" data-source-line="11" id="ent0003"><ellipse cx="1638.54" cy="462.0203" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:1;"/><path d="M1638.54,470.0203 L1638.54,497.0203 M1625.54,478.0203 L1651.54,478.0203 M1638.54,497.0203 L1625.54,512.0203 M1638.54,497.0203 L1651.54,512.0203" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="20.0962" x="1628.4919" y="522.7215">Host</text></g><g class="entity" data-qualified-name="GMN45" data-source-line="84" id="ent0046"><path d="M391.72,334.7203 L391.72,524.9137 L608.3821,524.9137 L608.3821,344.7203 L598.3821,334.7203 L391.72,334.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M598.3821,334.7203 L598.3821,344.7203 L608.3821,344.7203 L598.3821,334.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="82.8809" x="397.72" y="348.4215">Design Principles:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="195.6621" x="397.72" y="359.0211">P6: resetForReplay() resets model, not object</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="180.4175" x="397.72" y="369.6207">P1: Room IS its scenario &#8212; reset scenario</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="146.3599" x="397.72" y="380.2203">P11: No protocol knowledge in UI</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="166.5923" x="397.72" y="390.8199">P4: Room resets itself (polymorphism)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="397.72" y="401.4195">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="129.1772" x="397.72" y="412.0191">What resetForReplay() does:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.9917" x="397.72" y="422.6188">- this.state = 'waiting'</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="71.6309" x="397.72" y="433.2184">- this.round = 0</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="150.4951" x="397.72" y="443.818">- this.deck = createShuffledDeck()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="82.5952" x="397.72" y="454.4176">- this.gmHand = []</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="108.3384" x="397.72" y="465.0172">- this.currentCard = null</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="164.9224" x="397.72" y="475.6168">- players.forEach: score=0, streak=0,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="134.5254" x="403.4153" y="486.2164">alive=true, currentGuess=null,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="147.1597" x="403.4153" y="496.816">roundsPlayed=0, inventory=fresh</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="145.3184" x="397.72" y="507.4156">- keep: players Map, chatHistory,</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="103.2407" x="403.4153" y="518.0152">hostId, spectators, bots</text></g><g class="entity" data-qualified-name="GMN48" data-source-line="104" id="ent0049"><path d="M61.79,572.7203 L61.79,656.9176 L250.4018,656.9176 L250.4018,582.7203 L240.4018,572.7203 L61.79,572.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M240.4018,572.7203 L240.4018,582.7203 L250.4018,582.7203 L240.4018,572.7203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" font-weight="bold" lengthAdjust="spacing" textLength="57.9858" x="67.79" y="586.4215">Root causes:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="151.1895" x="67.79" y="597.0211">1. No PLAY_AGAIN server message</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="153.8789" x="67.79" y="607.6207">2. Client does leave+rejoin (wrong)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="160.9629" x="67.79" y="618.2203">3. state='finished' blocks addPlayer()</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="157.6714" x="67.79" y="628.8199">4. User rooms auto-delete after 60s</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="167.6118" x="67.79" y="639.4195">5. Preset rooms delete+recreate (race)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="161.543" x="67.79" y="650.0191">6. No resetForReplay() method exists</text></g><!--link player to B2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="29" id="lnk13"><path d="M170.54,732.2703 C207.75,745.3303 312.54,787.3403 361.4,860.8203 C372.41,877.3703 355.9,890.2403 369.4,904.8203 C386.8,923.6003 407.2611,931.5371 431.7011,935.5971" fill="none" id="player-to-B2" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="437.62,936.5803,429.3972,931.1595,432.6876,935.7609,428.0862,939.0514,437.62,936.5803" style="stroke:#000000;stroke-width:1;"/></g><!--link B1 to B2--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="30" id="lnk14"><path d="M201.8,904.0503 C263.45,911.2603 368.6006,923.5632 436.1306,931.4632" fill="none" id="B1-to-B2" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="442.09,932.1603,433.6157,927.1417,437.1239,931.5793,432.6862,935.0875,442.09,932.1603" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="74.7378" x="283.9" y="911.7615">GAME_OVER msg</text></g><!--link B2 to B3--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="31" id="lnk15"><path d="M562.82,939.2503 C607.78,939.5703 662.7801,939.9483 709.8601,940.2783" fill="none" id="B2-to-B3" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="715.86,940.3203,706.8883,936.2573,710.8601,940.2853,706.8322,944.2571,715.86,940.3203" style="stroke:#000000;stroke-width:1;"/></g><!--link B3 to B4--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="32" id="lnk16"><path d="M860.86,940.8203 C899.85,940.8203 941.73,940.8203 979.53,940.8203" fill="none" id="B3-to-B4" style="stroke:#000000;strok