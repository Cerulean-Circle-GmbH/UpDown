<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Dynamic base path for GitHub Pages vs localhost -->
  <script>
    // Detect environment and set base path
    const isGitHubPages = window.location.hostname.includes('github.io');
    const basePath = isGitHubPages ? '/UpDown/' : '/';
    document.write('<base href="' + basePath + '">');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UpDown">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#667eea">
  <title>UpDown - Card Guessing Game (TypeScript)</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Lit web component handles everything -->
  <game-board></game-board>
  <player-notification></player-notification>

  <script type="module" src="dist/main.js"></script>
  <div id="ud-ver" style="position:fixed;bottom:4px;left:50%;transform:translateX(-50%);z-index:200">
    <span id="ud-nav-ver" style="cursor:pointer;color:rgba(255,255,255,0.4);font-size:0.65rem;text-decoration:underline;text-decoration-style:dotted" onclick="var p=document.getElementById('ud-project-nav');p.style.display=p.style.display==='none'?'flex':'none'">v0.3.0 · qndNow</span>
  </div>
  <div id="ud-project-nav" style="display:none;position:fixed;bottom:22px;left:0;right:0;justify-content:center;gap:8px;padding:6px;background:rgba(0,0,0,0.8);z-index:201;backdrop-filter:blur(6px)">
    <a href="/md/qnd/README.md" style="padding:4px 10px;border-radius:6px;background:#667eea;color:white;text-decoration:none;font-size:0.7rem">📋 Spec</a>
    <a href="/docs" style="padding:4px 10px;border-radius:6px;background:#667eea;color:white;text-decoration:none;font-size:0.7rem">📖 Docs</a>
    <a href="/md/scrum.pmo/sprints/sprint-3-qnd-multiplayer-game/planning.md" style="padding:4px 10px;border-radius:6px;background:#667eea;color:white;text-decoration:none;font-size:0.7rem">🗂 Planning</a>
    <a href="/bug-report" style="padding:4px 10px;border-radius:6px;background:#e74c3c;color:white;text-decoration:none;font-size:0.7rem">🐛 Bug Report</a>
  </div>
  <script>fetch('/api/config').then(r=>r.json()).then(c=>{const e=document.getElementById('ud-nav-ver');if(e&&c.version)e.textContent='v'+c.version+' · '+(c.branch||'')}).catch(()=>{})</script>
</body>
</html>
