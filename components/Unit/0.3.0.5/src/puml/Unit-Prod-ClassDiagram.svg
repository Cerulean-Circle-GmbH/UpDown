2789">&#8226; Folder support (&#176;folder.unit)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="96.1963" x="794.75" y="1094.8785">&#8226; rename/renameLink</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="175.3022" x="794.75" y="1105.4781">&#8226; Terminal identity (setTerminalIdentity)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="95.4932" x="794.75" y="1116.0777">&#8226; UUIDv4 value object</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="151.7783" x="794.75" y="1126.6773">&#8226; DefaultStorage (own, not shared)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="156.0938" x="794.75" y="1137.277">&#8226; UnitCLI create/classify commands</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="2.8477" x="794.75" y="1147.8766">&#160;</text><text fill="#008000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="140.5459" x="794.75" y="1158.4762">0.3.23.x HAS / 0.3.0.5 MISSING:</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="172.6436" x="794.75" y="1169.0758">&#8226; UnitDiscoveryService (auto-discovery)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="163.9556" x="794.75" y="1179.6754">&#8226; ScenarioService (migration + CRUD)</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="145.7886" x="794.75" y="1190.275">&#8226; ComponentManifest generation</text><text fill="#000000" font-family="'Segoe UI'" font-size="9" lengthAdjust="spacing" textLength="229.4956" x="794.75" y="1200.8746">&#8226; @web4x/ucp integration (extends UcpComponent)</text></g><!--link IUnitRef to ESS--><g class="link" data-