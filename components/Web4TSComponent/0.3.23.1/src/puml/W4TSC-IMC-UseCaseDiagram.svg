weight="bold" lengthAdjust="spacing" textLength="124.8242" x="537.43" y="2791.8283">DelegationProxy Pattern</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="238.9893" x="537.43" y="2803.6056">IMC's own use cases: create, process, completion</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="213.9307" x="537.43" y="2815.383">Delegated use cases: info, build, test, clean,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="94.7754" x="543.7581" y="2827.1603">links, tree, upgrade</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="143.1787" x="537.43" y="2838.9377">All delegated UCs go through</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="167.0117" x="543.7581" y="2850.715">DelegationProxy.delegateMethod()</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="161.4014" x="543.7581" y="2862.4923">which calls the W4TSC equivalent</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="200" id="ent0117"><path d="M549.92,83.8203 L549.92,140.9297 L772.9366,140.9297 L772.9366,93.8203 L762.9366,83.8203 L549.92,83.8203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M762.9366,83.8203 L762.9366,93.8203 L772.9366,93.8203 L762.9366,83.8203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="119.2822" x="555.92" y="98.4883">on() = Context Loading</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="202.0166" x="555.92" y="110.2656">web4tscomponent on ONCE 0.3.23.1 info</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="140.7031" x="555.92" y="122.043">Loads ONCE as context, then</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="164.6875" x="555.92" y="133.8203">executes info on ONCE via W4TSC</text></g><!--link user to UC1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="98" id="lnk53"><path d="M53.44,1757.6703 C52.4,1633.2903 55.27,1230.1303 133.94,1133.3803 C246.3,995.2003 462.1106,959.0172 578.7206,949.3272" fill="none" id="user-to-UC1" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="584.7,948.8303,575.3997,945.5894,579.7172,949.2444,576.0622,953.5619,584.7,948.8303" style="stroke:#000000;stroke-width:1;"/></g><!--link user to UC2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="99" id="lnk54"><path d="M55.98,1757.8003 C61.75,1666.4403 81.47,1431.7503 133.94,1377.3803 C253.57,1253.4103 468.246,1250.5528 582.176,1258.8828" fill="none" id="user-to-UC2" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="588.16,1259.3203,579.4756,1254.6747,583.1733,1258.9557,578.8923,1262.6534,588.16,1259.3203" style="stroke:#000000;stroke-width:1;"/></g><!--link user to UC3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="100" id="lnk55"><path d="M58.01,1757.6803 C67.28,1680.2803 92.49,1504.0403 133.94,1462.3803 C255.32,1340.4003 466.7031,1329.3168 580.4531,1332.9868" fill="none" id="user-to-UC3" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="586.45,1333.1803,577.5837,1328.8922,581.4526,1333.0191,577.3257,1336.888,586.45,1333.1803" style="stroke:#000000;stroke-width:1;"/></g><!--link user to UC4--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="101" id="lnk56"><path d="M62.12,1757.8103 C72.45,1719.9703 93.92,1661.8103 133.94,1628.3803 C263.