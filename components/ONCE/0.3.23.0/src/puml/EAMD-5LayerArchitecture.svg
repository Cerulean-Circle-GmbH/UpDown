<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="1223px" preserveAspectRatio="none" style="width:655px;height:1223px;background:#FFFFFF;" version="1.1" viewBox="0 0 655 1223" width="655px" zoomAndPan="magnify"><title>EAMD.ucp 5-Layer Architecture Reference
Original EAM layers + UpDown P7 extension</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="476.0615" x="85.067" y="36.2695">EAMD.ucp 5-Layer Architecture Reference</text><text fill="#000000" font-family="'Segoe UI'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="504.0449" x="71.0753" y="62.1797">Original EAM layers + UpDown P7 extension</text></g><!--cluster L5--><g class="cluster" data-qualified-name="L5" data-source-line="13" id="ent0002"><path d="M13.5,83.8203 L127.3662,83.8203 A3.75,3.75 0 0 1 129.8662,86.3203 L136.8662,101.5977 L391.5,101.5977 A2.5,2.5 0 0 1 394,104.0977 L394,223.9803 A2.5,2.5 0 0 1 391.5,226.4803 L13.5,226.4803 A2.5,2.5 0 0 1 11,223.9803 L11,86.3203 A2.5,2.5 0 0 1 13.5,83.8203" fill="#FCE4EC" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="11" x2="136.8662" y1="101.5977" y2="101.5977"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="112.8662" x="15" y="95.4883">Layer 5 &#8212; UX &amp; Views</text></g><!--cluster L4--><g class="cluster" data-qualified-name="L4" data-source-line="28" id="ent0004"><path d="M55.5,266.4803 L215.8652,266.4803 A3.75,3.75 0 0 1 218.3652,268.9803 L225.3652,284.2577 L391.5,284.2577 A2.5,2.5 0 0 1 394,286.7577 L394,465.5303 A2.5,2.5 0 0 1 391.5,468.0303 L55.5,468.0303 A2.5,2.5 0 0 1 53,465.5303 L53,268.9803 A2.5,2.5 0 0 1 55.5,266.4803" fill="#FFF3E0" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="53" x2="225.3652" y1="284.2577" y2="284.2577"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="159.3652" x="57" y="278.1483">Layer 4 &#8212; Async Orchestration</text></g><!--cluster L3--><g class="cluster" data-qualified-name="L3" data-source-line="48" id="ent0006"><path d="M50.5,508.0303 L248.2139,508.0303 A3.75,3.75 0 0 1 250.7139,510.5303 L257.7139,525.8077 L391.5,525.8077 A2.5,2.5 0 0 1 394,528.3077 L394,718.8603 A2.5,2.5 0 0 1 391.5,721.3603 L50.5,721.3603 A2.5,2.5 0 0 1 48,718.8603 L48,510.5303 A2.5,2.5 0 0 1 50.5,508.0303" fill="#F5F5F5" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="48" x2="257.7139" y1="525.8077" y2="525.8077"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="196.7139" x="52" y="519.6983">Layer 3 &#8212; Interfaces &amp; Runtime Types</text></g><!--cluster L2--><g class="cluster" data-qualified-name="L2" data-source-line="69" id="ent0008"><path d="M28.5,761.3603 L258.6064,761.3603 A3.75,3.75 0 0 1 261.1064,763.8603 L268.1064,779.1377 L391.5,779.1377 A2.5,2.5 0 0 1 394,781.6377 L394,948.6303 A2.5,2.5 0 0 1 391.5,951.1303 L28.5,951.1303 A2.5,2.5 0 0 1 26,948.6303 L26,763.8603 A2.5,2.5 0 0 1 28.5,761.3603" fill="#E8F5E9" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="26" x2="268.1064" y1="779.1377" y2="779.1377"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="229.1064" x="30" y="773.0283">Layer 2 &#8212; Implementation (Default* classes)</text></g><!--cluster L1--><g class="cluster" data-qualified-name="L1" data-source-line="88" id="ent0010"><path d="M20.5,991.1303 L211.998,991.1303 A3.75,3.75 0 0 1 214.498,993.6303 L221.498,1008.9077 L391.5,1008.9077 A2.5,2.5 0 0 1 394,1011.4077 L394,1213.7403 A2.5,2.5 0 0 1 391.5,1216.2403 L20.5,1216.2403 A2.5,2.5 0 0 1 18,1213.7403 L18,993.6303 A2.5,2.5 0 0 1 20.5,991.1303" fill="#E3F2FD" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="18" x2="221.498" y1="1008.9077" y2="1008.9077"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="190.498" x="22" y="1002.7983">Layer 1 &#8212; Kernel &amp; OS Infrastructure</text></g><g class="entity" data-qualified-name="L5.N5" data-source-line="15" id="ent0003"><path d="M35.08,121.8203 L35.08,202.4844 L350.9189,202.4844 L350.9189,131.8203 L340.9189,121.8203 L35.08,121.8203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M340.9189,121.8203 L340.9189,131.8203 L350.9189,131.8203 L340.9189,121.8203" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="44.2432" x="41.08" y="136.4883">Purpose:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="120.1514" x="88.4872" y="136.4883">User-facing components</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="75.874" x="41.08" y="148.2656">EAMD original:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="168.3838" x="120.1181" y="148.2656">Card, Form, FileSystem, UserPanel,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="288.5107" x="47.4081" y="160.043">Workflow, css/, html/ &#8212; Web Components, visual elements</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="45.9717" x="41.08" y="171.8203">UpDown:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="208.3545" x="90.2157" y="171.8203">ONCECLI, Web4TSComponentCLI, Lit Views</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="233.374" x="47.4081" y="183.5977">(OnceServerStatusView, OncePeerItemView, etc.)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="25.0488" x="41.08" y="195.375">Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="181.5234" x="69.2929" y="195.375">Presentation only, delegates to L2/L4</text></g><g class="entity" data-qualified-name="L4.N4" data-source-line="30" id="ent0005"><path d="M77.28,304.4803 L77.28,444.0311 L350.7263,444.0311 L350.7263,314.4803 L340.7263,304.4803 L77.28,304.4803" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M340.7263,304.4803 L340.7263,314.4803 L350.7263,314.4803 L340.7263,304.4803" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="44.2432" x="83.28" y="319.1483">Purpose:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="133.1982" x="130.6872" y="319.1483">Asynchronous coordination</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="75.874" x="83.28" y="330.9256">EAMD original:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="173.4082" x="162.3181" y="330.9256">DID NOT EXIST (no L4 in EAMD.ucp)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="80.8838" x="83.28" y="342.703">UpDown added:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="153.3838" x="167.3279" y="342.703">IOR (Internet Object Reference),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="214.5313" x="89.6081" y="354.4803">FileLoader, HTTPSLoader, WebSocketLoader,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="188.2568" x="89.6081" y="366.2577">CertificateOrchestrator, TSCompletion,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="153.9355" x="89.6081" y="378.035">ProxyRoute, ReverseProxyRoute</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="41.0742" x="83.28" y="389.8123">P7 Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="197.7881" x="127.5183" y="389.8123">ONLY layer where async/await is allowed</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="136.5771" x="89.6081" y="401.5897">L1-L3 must be synchronous</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="60.498" x="83.28" y="413.367">Key insight:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="148.8428" x="146.9421" y="413.367">This split enables testability &#8212;</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="160.1172" x="89.6081" y="425.1444">sync logic (L1-L3) is easy to test,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="176.2354" x="89.6081" y="436.9217">async orchestration (L4) handles I/O</text></g><g class="entity" data-qualified-name="L3.N3" data-source-line="50" id="ent0007"><path d="M71.73,546.0303 L71.73,697.3584 L350.2691,697.3584 L350.2691,556.0303 L340.2691,546.0303 L71.73,546.0303" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M340.2691,546.0303 L340.2691,556.0303 L350.2691,556.0303 L340.2691,546.0303" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="44.2432" x="77.73" y="560.6983">Purpose:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="139.0332" x="125.1372" y="560.6983">Contracts + domain services</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="75.874" x="77.73" y="572.4756">EAMD original:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="162.0117" x="156.7681" y="572.4756">DomainEntity, Filter, Governance,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="218.042" x="84.0581" y="584.253">Service, connectors, accounting, inventory &#8212;</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="246.9434" x="84.0581" y="596.0303">EAM DOMAIN BUSINESS LOGIC (not just interfaces!)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="45.9717" x="77.73" y="607.8077">UpDown:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="190.8789" x="126.8657" y="607.8077">*.interface.ts files + RUNTIME CLASSES:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="197.1729" x="84.0581" y="619.585">JsInterface (P35: runtime interface base),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="246.8555" x="84.0581" y="631.3623">UcpModel (ISR proxy &#8212; hundreds of lines of logic),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="219.541" x="84.0581" y="643.1397">TypeDescriptor, PersistenceManager, Storage</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="60.498" x="77.73" y="654.917">Key insight:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="193.877" x="141.3921" y="654.917">L3 is NOT "just interfaces" &#8212; it contains</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="220.1367" x="84.0581" y="666.6944">runtime classes that NEED to exist at runtime</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="205.249" x="84.0581" y="678.4717">for RelatedObjects, type checking, and ISR</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="25.0488" x="77.73" y="690.2491">Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="83.5498" x="105.9429" y="690.2491">Synchronous (P7)</text></g><g class="entity" data-qualified-name="L2.N2" data-source-line="71" id="ent0009"><path d="M49.68,799.3603 L49.68,927.1338 L350.3138,927.1338 L350.3138,809.3603 L340.3138,799.3603 L49.68,799.3603" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M340.3138,799.3603 L340.3138,809.3603 L350.3138,809.3603 L340.3138,799.3603" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="44.2432" x="55.68" y="814.0283">Purpose:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="127.9639" x="103.0872" y="814.0283">Concrete implementations</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="75.874" x="55.68" y="825.8056">EAMD original:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="126.7529" x="134.7181" y="825.8056">DefaultFile, DefaultFolder,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="257.4268" x="62.0081" y="837.583">User, Session, RESTClient, Web4Proxy, TestRunner &#8212;</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="239.0088" x="62.0081" y="849.3603">the Default* classes that implement L3 interfaces</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="45.9717" x="55.68" y="861.1377">UpDown:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="220.3418" x="104.8157" y="861.1377">UcpComponent, UcpController, TypeRegistry,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="245.0537" x="62.0081" y="872.915">DefaultUnit, UcpStorage, HTTPServer, HTTPRouter,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="273.3057" x="62.0081" y="884.6923">DefaultWeb4TSComponent, DefaultCLI, SemanticVersion</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="41.0742" x="55.68" y="896.4697">P6 Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="166.0352" x="99.9183" y="896.4697">Empty constructor + init(scenario)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="47.6709" x="55.68" y="908.247">P16 Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="213.1592" x="106.515" y="908.247">Object.verb naming (linksGet, scenarioSave)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="25.0488" x="55.68" y="920.0244">Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="83.5498" x="83.8929" y="920.0244">Synchronous (P7)</text></g><g class="entity" data-qualified-name="L1.N1" data-source-line="90" id="ent0011"><path d="M41.77,1029.1303 L41.77,1192.2358 L350.2212,1192.2358 L350.2212,1039.1303 L340.2212,1029.1303 L41.77,1029.1303" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M340.2212,1029.1303 L340.2212,1039.1303 L350.2212,1039.1303 L340.2212,1029.1303" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="44.2432" x="47.77" y="1043.7983">Purpose:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="162.2607" x="95.1772" y="1043.7983">Runtime kernel and OS primitives</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="75.874" x="47.77" y="1055.5756">EAMD original:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="208.4131" x="126.8081" y="1055.5756">Thinglish/Once kernel (the ONCE runtime),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="221.2012" x="54.0981" y="1067.353">OnceServices (EventService) &#8212; the foundation</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="135.8594" x="54.0981" y="1079.1303">that everything else runs on</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="45.9717" x="47.77" y="1090.9077">UpDown:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="130.6494" x="96.9057" y="1090.9077">ONCE.ts (kernel singleton),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="200.3467" x="54.0981" y="1102.685">NodeOSInfrastructure (wraps os module),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="149.1846" x="54.0981" y="1114.4623">LoggingUtils, HostnameParser,</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="164.6484" x="54.0981" y="1126.2397">PlatformDetection (isNode check),</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="125.5957" x="54.0981" y="1138.017">DefaultEnvironmentModel</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="60.498" x="47.77" y="1149.7944">Key insight:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="150.5859" x="111.4321" y="1149.7944">L1 is specifically the KERNEL &#8212;</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="201.4453" x="54.0981" y="1161.5717">not generic infrastructure. Only code that</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="218.4912" x="54.0981" y="1173.3491">MUST run before anything else belongs here.</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="25.0488" x="47.77" y="1185.1264">Rule:</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="83.5498" x="75.9829" y="1185.1264">Synchronous (P7)</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="116" id="ent0017"><path d="M421.8,86.4903 L421.8,237.8184 L648.1955,237.8184 L648.1955,96.4903 L638.1955,86.4903 L421.8,86.4903" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M638.1955,86.4903 L638.1955,96.4903 L648.1955,96.4903 L638.1955,86.4903" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="88.9209" x="427.8" y="101.1583">Dependency Rule</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="183.1055" x="427.8" y="112.9356">Higher layers depend on lower layers.</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="199.9902" x="427.8" y="124.713">Never upward: L1 never imports from L2.</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="3.1641" x="427.8" y="136.4903">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="98.7598" x="427.8" y="148.2677">P7 Async Boundary</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="123.6426" x="427.8" y="160.045">L1, L2, L3 = synchronous</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="128.335" x="427.8" y="171.8223">L4 = async (await allowed)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="107.1094" x="427.8" y="183.5997">L5 = async (UI events)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="3.1641" x="427.8" y="195.377">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="92.0557" x="427.8" y="207.1544">EAMD vs UpDown</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="135.1123" x="427.8" y="218.9317">EAMD had 4 layers (1,2,3,5)</text><text fill="#000000" font-family="'Segoe UI'" font-size="10" lengthAdjust="spacing" textLength="205.3955" x="427.8" y="230.7091">UpDown added L4 for P7 async separation</text></g><!--link L5 to L4--><!--link L4 to L3--><!--link L3 to L2--><!--link L2 to L1--><!--link L5 to GMN16--><g class="link" data-entity-1="ent0002" data-entity-2="ent0017" data-link-type="association" data-source-line="116" id="lnk18"><path d="M394.0554,162.1503 C394.1007,162.1503 394.146,162.1503 394.1913,162.1503 C394.5537,162.1503 394.9161,162.1503 395.2784,162.1503 C398.1775,162.1503 401.0763,162.1503 403.975,162.1503 C409