Adjust="spacing" textLength="86.4424" x="1748.92" y="108.166">```typescript</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.835" x="1748.92" y="123.4766">// Import ONCE singleton accessor</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.8628" x="1748.92" y="138.7871">import { ONCE } from '@web4x/once';</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1748.92" y="154.0977">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.3833" x="1748.92" y="169.4082">// In Node.js</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3252" x="1748.92" y="184.7188">const kernel = await ONCE.start(scenario);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1748.92" y="200.0293">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.6621" x="1748.92" y="215.3398">// In Browser</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3252" x="1748.92" y="230.6504">const kernel = await ONCE.start(scenario);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1748.92" y="245.9609">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.2603" x="1748.92" y="261.2715">// In Worker</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3252" x="1748.92" y="276.582">const kernel = await ONCE.start(scenario);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1748.92" y="291.8926">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.2319" x="1748.92" y="307.2031">// Always returns OnceKernel interface</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.9453" x="1748.92" y="322.5137">const health = await kernel.getHealth();</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.1523" x="1748.92" y="337.8242">const result = await kernel.invokeMethod('getPeers', {});</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1748.92" y="353.1348">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2007" x="1748.92" y="368.4453">// Access global singleton</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.4253" x="1748.92" y="383.7559">const instance = ONCE.getInstance();</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.9561" x="1748.92" y="399.0664">```</text></g><g class="entity" data-qualified-name="DetectionFlow" data-source-line="248" id="ent0041"><path d="M2150.16,82.9466 L2150.16,383.847 A0,0 0 0 0 2150.16,383.847 L2291.23,383.847 L2214.67,517.1966 L2299.23,383.847 L2621.8372,383.847 A0,0 0 0 0 2621.8372,383.847 L2621.8372,92.9466 L2611.8372,82.9466 L2150.16,82.9466 A0,0 0 0 0 2150.16,82.9466" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2611.8372,82.9466 L2611.8372,92.9466 L2621.8372,92.9466 L2611.8372,82.9466" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="193.2861" x="2156.16" y="100.5149">Environment Detection Logic</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2156.16" y="